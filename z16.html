<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>萍 · 池上</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet"><style>
:root{
  --ink:#1d1d1b; --paper:#f4ecd8; --card:#fffdf6; --red:#c0392b;
  --brush:'Ma Shan Zheng','KaiTi','STKaiti','Kaiti SC','Songti SC',serif;
  --body:'Noto Serif SC','Songti SC','SimSun',Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--body);
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(ellipse at 90% 100%, rgba(190,160,110,.18), transparent 50%),
    var(--paper);
  min-height:100vh; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid #3578c6; outline-offset:3px}
.wrap{max-width:560px; margin:0 auto; padding:16px 16px 44px; display:flex; flex-direction:column; align-items:center; gap:20px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition-duration:.01ms!important; scroll-behavior:auto!important}
}

.pic{width:min(78vw,320px); aspect-ratio:16/9; border:3px solid var(--ink); border-radius:14px; background:var(--card); display:grid; place-items:center}
.pic svg{height:88%; width:auto; display:block; stroke-width:1.3}
.sq{width:min(78vw,320px); aspect-ratio:1; border:3px solid var(--ink); border-radius:6px; background:var(--card); transition:background .3s}
.sq svg{display:block; width:100%; height:100%}
.py{margin:0 0 -16px; min-height:1.3em; font-family:var(--body); font-weight:700; font-size:34px; line-height:1.3; letter-spacing:.04em; text-align:center; color:var(--ink)}
.py.hide{visibility:hidden}
.big{width:100%; min-height:150px; border:0; background:transparent; padding:0; line-height:1.15;
  font-family:var(--brush); font-size:124px; color:var(--ink); white-space:nowrap; overflow:hidden; text-align:center}
.big.en{font-family:var(--body); font-weight:700}
.vrow{display:flex; gap:8px; width:100%; justify-content:center}
.vb{flex:1 1 0; min-width:0; max-width:76px; height:64px; border:3px solid var(--ink); border-radius:12px; background:var(--card); padding:4px; display:grid; place-items:center}
.vb svg{width:100%; height:100%; display:block}
.vb.on{box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--ink)}
.gf{margin:4px 0 -6px; font-family:var(--body); font-size:22px; font-weight:700; letter-spacing:.04em; align-self:flex-start}
.words{display:grid; grid-template-columns:1fr; gap:12px; width:100%}
@media (min-width:520px){.words{grid-template-columns:1fr 1fr}}
.w{display:flex; align-items:center; gap:12px; min-height:68px; padding:6px 14px 6px 10px; border:3px solid var(--ink); border-radius:16px; background:var(--card); text-align:left; min-width:0}
.w .ic{flex:0 0 46px; width:46px; height:46px}
.w .ic svg{width:100%; height:100%; display:block}
.w .t{flex:1 1 auto; min-width:0; white-space:nowrap; overflow:hidden; font-family:var(--brush); font-size:32px; line-height:1.2}
.w.en{border-color:var(--red)}
.w.en .t{font-family:var(--body); font-weight:700; color:var(--red)}
.back{display:flex; align-items:center; justify-content:center; min-height:64px; width:100%; margin-top:6px; border:3px solid var(--ink); border-radius:16px; background:var(--ink); color:var(--paper); text-decoration:none; font-family:var(--brush); font-size:30px}
</style></head><body><div class="wrap"><div class="sq" id="sq"></div><div class="py" id="py" aria-hidden="true"></div><button type="button" class="big" id="big"></button><h2 class="gf">Good friends</h2><div class="words"><button type="button" class="w" data-zh="浮萍" data-en="duckweed"><span class="ic"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="22" rx="8" ry="5" fill="#fff"/><ellipse cx="32" cy="18" rx="8" ry="5" fill="#fff"/><ellipse cx="26" cy="30" rx="8" ry="5" fill="#fff"/><path d="M4 41q5-3 10 0t10 0t10 0t10 0"/></svg></span><span class="t">浮萍</span></button><button type="button" class="w" data-zh="水萍" data-en="pond"><span class="ic"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="28" rx="20" ry="12" fill="#fff"/><path d="M10 28q4-3 8 0M26 31q4-3 8 0"/><path d="M36 14v10M40 11v13"/></svg></span><span class="t">水萍</span></button><button type="button" class="w" data-zh="萍萍" data-en="girl"><span class="ic"><svg viewBox="0 0 48 48" aria-hidden="true" focusable="false" fill="none" stroke="#222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="31" r="4" fill="#222"/><circle cx="40" cy="31" r="4" fill="#222"/><circle cx="24" cy="26" r="13" fill="#fff"/><path d="M11 26q0-15 13-15t13 15q-3-9-13-9t-13 9z" fill="#222"/><circle cx="19" cy="28" r="1.5" fill="#222"/><circle cx="29" cy="28" r="1.5" fill="#222"/><path d="M20 34q4 3 8 0"/></svg></span><span class="t">萍萍</span></button></div><a class="back" href="./">回到诗</a></div><script>
(function(){
  var DATA={"萍":{"s":["M 648 713 Q 699 723 819 715 Q 834 714 839 722 Q 843 732 831 747 Q 783 786 701 765 Q 683 764 666 759 L 609 750 Q 528 740 439 727 L 394 721 Q 312 714 222 704 Q 194 701 214 687 Q 253 660 332 677 Q 366 686 401 691 L 442 697 Q 446 703 600 711 L 648 713 Z","M 439 727 Q 438 754 436 776 Q 437 794 419 799 Q 382 817 362 810 Q 346 801 360 784 Q 384 756 394 721 L 401 691 Q 413 634 428 619 Q 440 609 444 620 Q 447 630 442 697 L 439 727 Z","M 666 759 Q 673 778 689 802 Q 702 817 692 827 Q 680 843 647 860 Q 631 869 615 860 Q 605 854 612 844 Q 624 817 609 750 L 600 711 Q 578 635 579 619 Q 580 606 595 616 Q 605 625 648 713 L 666 759 Z","M 263 539 Q 285 517 310 490 Q 322 477 337 476 Q 347 476 353 489 Q 357 502 351 532 Q 347 550 319 564 Q 258 591 240 587 Q 236 583 236 571 Q 239 561 263 539 Z","M 156 422 Q 204 365 233 352 Q 246 349 255 361 Q 262 373 260 388 Q 251 433 170 456 L 169 457 Q 154 463 145 459 Q 139 458 141 447 Q 142 437 156 422 Z","M 163 155 Q 151 152 152 135 Q 165 60 193 42 Q 200 35 210 37 Q 217 38 220 63 Q 224 91 327 325 Q 334 340 334 346 Q 334 356 325 350 Q 309 340 201 189 Q 188 171 163 155 Z","M 603 535 Q 760 572 763 574 Q 770 581 767 589 Q 760 599 734 607 Q 707 611 615 581 Q 542 563 480 558 Q 447 552 471 537 Q 507 518 553 525 L 603 535 Z","M 429 421 Q 448 397 470 369 Q 480 356 494 355 Q 503 354 509 365 Q 515 377 511 404 Q 510 422 484 438 Q 424 469 412 467 Q 408 464 407 453 Q 408 443 429 421 Z","M 744 490 Q 726 456 674 393 Q 665 377 680 381 Q 701 394 782 452 Q 798 467 819 476 Q 837 486 827 501 Q 815 516 792 527 Q 771 539 760 535 Q 748 534 753 522 Q 756 506 744 490 Z","M 629 271 Q 674 277 917 276 Q 938 276 942 284 Q 948 296 932 310 Q 881 350 842 342 Q 763 327 629 308 L 577 302 Q 472 292 353 278 Q 332 277 347 259 Q 360 244 379 239 Q 400 233 416 237 Q 491 256 576 265 L 629 271 Z","M 574 -39 Q 580 -64 586 -73 Q 592 -80 599 -78 Q 617 -66 620 -11 Q 629 59 628 128 Q 627 165 629 271 L 629 308 Q 632 431 643 491 Q 647 509 633 518 Q 615 530 603 535 C 576 549 540 552 553 525 Q 554 524 556 520 Q 577 475 578 407 Q 577 361 577 302 L 576 265 Q 570 3 574 -39 Z"],"m":[[[216,697],[258,689],[302,691],[497,721],[745,746],[803,739],[829,728]],[[368,796],[388,787],[407,768],[436,623]],[[619,851],[634,843],[653,814],[624,710],[587,619]],[[244,581],[312,534],[336,494]],[[152,450],[224,395],[238,371]],[[206,47],[196,75],[197,125],[328,344]],[[473,549],[494,543],[543,544],[723,586],[759,583]],[[415,458],[475,410],[495,370]],[[765,524],[782,492],[680,388]],[[350,268],[400,259],[543,281],[842,309],[894,304],[931,291]],[[559,525],[600,498],[606,480],[595,-68]]]}}, CFG={"base":"萍","baseEn":"duckweed","variants":null,"variantStart":0,"pics":{},"py":{"萍":"píng"}};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sq=document.getElementById('sq'), big=document.getElementById('big');
  var picEl=document.getElementById('pic'), vrow=document.getElementById('vrow');
  var cur={ch:CFG.base, en:CFG.baseEn, bg:'#fffdf6', ink:'#1d1d1b', fg:'#1d1d1b', outline:null, grid:'rgba(0,0,0,.16)'};
  var showEn=false, raf=0, token=0;

  function fit(el,max,min){
    el.style.fontSize=max+'px';
    var s=max;
    while(el.scrollWidth>el.clientWidth+0.5 && s>min){ s-=1; el.style.fontSize=s+'px'; }
  }
  function updateBig(){
    var py=document.getElementById('py'); py.textContent=CFG.py[cur.ch]||''; py.classList.toggle('hide',showEn);
    big.textContent=showEn?cur.en:cur.ch;
    big.className='big'+(showEn?' en':'');
    big.style.color=cur.fg;
    var o=cur.outline;
    big.style.textShadow=o?'-2px 0 '+o+',2px 0 '+o+',0 -2px '+o+',0 2px '+o+',-2px -2px '+o+',2px 2px '+o+',-2px 2px '+o+',2px -2px '+o:'none';
    if(showEn){ fit(big,64,18); } else { big.style.fontSize=''; }
    big.setAttribute('aria-label',showEn?cur.en:cur.ch);
  }
  big.addEventListener('click',function(){ showEn=!showEn; updateBig(); });

  function poly(m){
    var pts=m.map(function(p){return [p[0],p[1]];});
    function ext(a,b,d){ var dx=a[0]-b[0], dy=a[1]-b[1], l=Math.sqrt(dx*dx+dy*dy)||1; return [a[0]+dx/l*d, a[1]+dy/l*d]; }
    if(pts.length>1){ pts[0]=ext(pts[0],pts[1],22); pts[pts.length-1]=ext(pts[pts.length-1],pts[pts.length-2],22); }
    var len=0; for(var i=1;i<pts.length;i++){ var dx=pts[i][0]-pts[i-1][0], dy=pts[i][1]-pts[i-1][1]; len+=Math.sqrt(dx*dx+dy*dy); }
    return {d:'M'+pts.map(function(p){return Math.round(p[0])+' '+Math.round(p[1]);}).join('L'), len:len};
  }

  function startWriting(){
    token++; cancelAnimationFrame(raf);
    var d=DATA[cur.ch]; if(!d) return;
    var defs='', ghost='', strokes='', dur=[], start=[], t=0;
    d.s.forEach(function(p,i){
      var m=poly(d.m[i]);
      defs+='<clipPath id="cp'+i+'"><path d="'+p+'"/></clipPath>';
      ghost+='<path d="'+p+'"/>';
      strokes+='<g clip-path="url(#cp'+i+')"><path class="mk" d="'+m.d+'" pathLength="1" fill="none" stroke="'+cur.ink+'" stroke-width="170" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 2" stroke-dashoffset="'+(reduce?0:1)+'"/></g>';
      dur.push(Math.max(380,Math.min(900,m.len*0.9))); start.push(t); t+=dur[i]+140;
    });
    sq.style.background=cur.bg;
    sq.innerHTML='<svg viewBox="0 0 1024 1024" role="img" aria-label="'+cur.ch+'">'+
      '<g stroke="'+cur.grid+'" stroke-width="5" stroke-dasharray="16 14" fill="none"><path d="M512 8V1016M8 512H1016M8 8L1016 1016M1016 8L8 1016"/></g>'+
      '<g transform="scale(1,-1) translate(0,-900)"><defs>'+defs+'</defs>'+
      '<g fill="'+cur.ink+'" opacity=".08">'+ghost+'</g><g class="gm">'+strokes+'</g></g></svg>';
    if(reduce) return;
    var marks=sq.querySelectorAll('.mk'), gm=sq.querySelector('.gm');
    var writeEnd=t-140, HOLD=1300, FADE=450, PAUSE=350, total=writeEnd+HOLD+FADE+PAUSE;
    var my=token, t0=performance.now();
    function frame(now){
      if(my!==token) return;
      var e=(now-t0)%total;
      for(var i=0;i<marks.length;i++){
        var p=Math.max(0,Math.min(1,(e-start[i])/dur[i]));
        p=1-Math.pow(1-p,1.6);
        marks[i].setAttribute('stroke-dashoffset',String(1-p));
      }
      var f=e>writeEnd+HOLD?Math.max(0,1-(e-writeEnd-HOLD)/FADE):1;
      gm.setAttribute('opacity',String(f));
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }

  function choose(i){
    var it=CFG.variants.items[i];
    cur.ch=it.ch; cur.en=it.en;
    if(CFG.variants.kind==='color'){
      cur.bg=it.bg; cur.ink=it.ink; cur.fg=it.fg; cur.outline=it.outline;
      cur.grid=(it.ink==='#ffffff')?'rgba(255,255,255,.35)':'rgba(0,0,0,.16)';
    } else {
      picEl.innerHTML=CFG.pics[it.pic];
    }
    var bs=vrow.querySelectorAll('.vb');
    for(var k=0;k<bs.length;k++){ bs[k].classList.toggle('on',k===i); bs[k].setAttribute('aria-pressed',k===i?'true':'false'); }
    showEn=false; updateBig(); startWriting();
  }
  if(CFG.variants){
    var bs=vrow.querySelectorAll('.vb');
    for(var k=0;k<bs.length;k++){ (function(k){ bs[k].addEventListener('click',function(){ choose(k); }); })(k); }
    choose(CFG.variantStart);
  } else { updateBig(); startWriting(); }

  var ws=document.querySelectorAll('.w');
  function fitWord(b){ var t=b.querySelector('.t'); if(b.classList.contains('en')) fit(t,28,11); else t.style.fontSize=''; }
  for(var i=0;i<ws.length;i++){ (function(b){
    b.addEventListener('click',function(){
      var on=b.classList.toggle('en');
      b.querySelector('.t').textContent=on?b.getAttribute('data-en'):b.getAttribute('data-zh');
      fitWord(b);
    });
  })(ws[i]); }
  window.addEventListener('resize',function(){ for(var i=0;i<ws.length;i++) fitWord(ws[i]); if(showEn) updateBig(); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ for(var i=0;i<ws.length;i++) fitWord(ws[i]); if(showEn) updateBig(); });
})();
</script></body></html>
