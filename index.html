<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>池上</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet"><style>
:root{
  --ink:#1d1d1b; --paper:#f4ecd8; --card:#fffdf6; --red:#c0392b;
  --brush:'Ma Shan Zheng','KaiTi','STKaiti','Kaiti SC','Songti SC',serif;
  --body:'Noto Serif SC','Songti SC','SimSun',Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--body);
  background:
    radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(ellipse at 90% 100%, rgba(190,160,110,.18), transparent 50%),
    var(--paper);
  min-height:100vh; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:4px solid #3578c6; outline-offset:3px}
.wrap{max-width:560px; margin:0 auto; padding:16px 16px 44px; display:flex; flex-direction:column; align-items:center; gap:20px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition-duration:.01ms!important; scroll-behavior:auto!important}
}

.art{width:100%; max-width:720px; height:auto; display:block; border-radius:14px; box-shadow:0 2px 0 rgba(0,0,0,.08)}
.art text{font-family:var(--brush); fill:var(--ink); paint-order:stroke; stroke:rgba(255,250,236,.75); stroke-width:7px; stroke-linejoin:round}
.art text.seal{fill:#fff; stroke:none}
.art [data-stage]{transition:fill 2s ease, stroke 2s ease}
.vline{opacity:.15; transition:opacity 1s ease}
.vline.on{opacity:1}
/* 四个阶段：各自的区域从黑白渐变成彩色，读完整幅变彩色 */
.art .cl{opacity:0; transition:opacity 2s ease}
.art.s1 .cl[data-stage="1"],.art.s2 .cl[data-stage="2"],.art.s3 .cl[data-stage="3"],.art.s4 .cl[data-stage="4"]{opacity:1}
.art .full{opacity:0; transition:opacity .5s ease}
.art.s1.s2.s3.s4 .full{opacity:1; transition:opacity 1.4s ease 2s}
/* 小动画 */
.art .ov{pointer-events:none}
.art .rp ellipse{fill:none; stroke:#fff; stroke-width:6}
.art .rp{opacity:0; transform-box:fill-box; transform-origin:50% 50%}
.art.s1 .rp{animation:ring 2.6s ease-out infinite}
.art .pt{fill:#fde9ef; stroke:#e39ab0; stroke-width:2; opacity:0}
.art.s2 .pt{animation:petal 5.5s ease-in infinite; animation-delay:var(--d)}
.art .bird path{fill:none; stroke:#31405c; stroke-width:3.2; stroke-linecap:round; stroke-linejoin:round}
.art .bird{opacity:0}
.art.s3 .bird{opacity:1; animation:fly 5s ease-in-out infinite alternate; transition:opacity 2s ease}
.art.s3 .b2{animation-duration:6.5s}
.art.s3 .b3{animation-duration:4.2s}
.art .wv{fill:none; stroke:#fff; stroke-width:6; stroke-linecap:round; stroke-dasharray:44 26; opacity:0}
.art.s4 .wv{opacity:.85; animation:flow 4s linear infinite; transition:opacity 2s ease}
.art.s4 .wv1{animation-duration:5.5s; animation-direction:reverse}
@keyframes ring{0%{transform:scale(.4); opacity:.95}100%{transform:scale(1.3); opacity:0}}
@keyframes petal{0%{opacity:0; transform:translate(0,0) rotate(0)}15%{opacity:.95}100%{opacity:0; transform:translate(var(--dx),120px) rotate(220deg)}}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(60px,-14px)}}
@keyframes flow{to{stroke-dashoffset:-70}}

.ptitle{margin:0; font-family:var(--brush); font-size:48px; font-weight:400; letter-spacing:.12em; line-height:1.1}
.lines{display:flex; flex-direction:column; gap:12px; width:100%}
.lb{display:flex; align-items:center; gap:14px; width:100%; min-height:72px; padding:8px 16px; text-align:left;
  border:3px solid var(--ink); border-radius:16px; background:var(--card)}
.lb .box{flex:0 0 22px; width:22px; height:22px; border:3px solid var(--ink); border-radius:4px; background:transparent; transition:background .4s}
.lb.done .box{background:var(--ink)}
.lb .lt{font-family:var(--brush); font-size:34px; line-height:1.2; letter-spacing:.06em; white-space:nowrap}
.mic{display:flex; align-items:center; justify-content:center; gap:12px; width:100%; min-height:76px; border:3px solid var(--ink); border-radius:38px;
  background:var(--ink); color:var(--paper); font-family:var(--body); font-weight:700; font-size:26px; letter-spacing:.04em}
.mic svg{width:34px; height:34px; flex:0 0 34px}
.mic.listening{animation:pulse 1.4s ease-in-out infinite; background:var(--red); border-color:var(--red)}
.mic.again{background:var(--card); color:var(--ink)}
@keyframes pulse{0%,100%{transform:scale(1); box-shadow:0 0 0 0 rgba(192,57,43,.45)}50%{transform:scale(1.03); box-shadow:0 0 0 12px rgba(192,57,43,0)}}
.hint{margin:-6px 0 0; min-height:1.6em; text-align:center; font-family:var(--brush); font-size:28px; line-height:1.4}
.grid{display:flex; flex-direction:column; gap:10px; width:100%}
.grow{display:flex; gap:6px}
.gc{flex:1 1 0; min-width:0; height:88px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; border:2px solid var(--ink); border-radius:10px; background:var(--card);
  color:var(--ink); text-decoration:none; font-family:var(--brush); font-size:36px}
.gp{font-family:var(--body); font-weight:700; font-size:clamp(11px,3.4vw,15px); line-height:1.2; white-space:nowrap}
.gz{line-height:1.15}

  var LINES=["小娃撑小艇","偷采白莲回","不解藏踪迹","浮萍一道开"], SUMMARY="小娃偷采莲，水上开小路。", GROUPS=["小晓笑消肖销校效孝萧潇削","娃蛙洼哇挖袜瓦","撑称蹭瞠铛","艇挺町梃铤厅听亭停汀庭廷","偷头投透","采彩菜踩睬猜才财裁","白百柏佰摆","莲连联怜廉帘镰涟","回会汇惠慧徽灰挥悔毁","不布步部补捕簿卜","解介界借戒姐皆接结节街洁","藏仓苍沧舱","踪宗综总棕鬃纵","迹记计技济寄继剂季绩既际即积机击基极级几吉及急己纪","浮福服符扶幅伏俘富复付父夫附","萍平瓶评凭屏苹坪贫品","一以衣医依已移艺意议易亿义益忆异译伊姨椅","道到倒盗稻导岛","开凯慨楷看"];
  var MAP={}; GROUPS.forEach(function(g){ var c=Array.from(g); c.forEach(function(x){ MAP[x]=c[0]; }); });
  function norm(s){
    s=String(s||'').replace(/1/g,'一');
    return Array.from(s).filter(function(ch){ return /[一-鿿]/.test(ch); }).map(function(ch){ return MAP[ch]||ch; });
  }
  var TARGETS=LINES.map(norm);
  function lcs(a,b){
    var m=a.length, n=b.length, prev=new Array(n+1).fill(0), cur=new Array(n+1).fill(0);
    for(var i=1;i<=m;i++){
      for(var j=1;j<=n;j++){ cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]); }
      var t=prev; prev=cur; cur=t; cur.fill(0);
    }
    return prev[n];
  }
  // 在一个稍宽的窗口里找最长公共子序列，避免长句里零散字凑数
  function score(H,T){
    var w=T.length+2;
    if(H.length<=w) return lcs(H,T);
    var best=0;
    for(var i=0;i+w<=H.length;i++){ best=Math.max(best,lcs(H.slice(i,i+w),T)); }
    return best;
  }
  function need(len){ return len<=5?3:4; }

  var art=document.getElementById('art');
  var lineBtns=Array.prototype.slice.call(document.querySelectorAll('.lb'));
  var mic=document.getElementById('mic'), micLabel=document.getElementById('miclabel'), micIcon=document.getElementById('micicon');
  var hint=document.getElementById('hint');
  var ICON_MIC='<path d="M17 3a4 4 0 0 0-4 4v10a4 4 0 0 0 8 0V7a4 4 0 0 0-4-4z" fill="currentColor"/><path d="M8 15q0 9 9 9t9-9M17 24v6M12 30h10" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>';
  var ICON_AGAIN='<path d="M27 17a10 10 0 1 1-3.5-7.6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M26 4v7h-7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';

  var claimed=[], done=[], timers=[];
  var rec=null, listening=false, fatal=false, finished=false;

  function setHint(t){ hint.textContent=t||''; }
  function setUI(state){
    mic.classList.toggle('listening',state==='listening');
    mic.classList.toggle('again',state==='again');
    micLabel.textContent=state==='listening'?'Listening':(state==='again'?'Again':'Start');
    micIcon.innerHTML=state==='again'?ICON_AGAIN:ICON_MIC;
  }

  function colorStage(n){
    art.classList.add('s'+n);
    var els=art.querySelectorAll('[data-stage="'+n+'"]');
    for(var i=0;i<els.length;i++){
      var e=els[i], f=e.getAttribute('data-fill'), s=e.getAttribute('data-stroke');
      if(f) e.style.fill=f;
      if(s) e.style.stroke=s;
    }
  }
  function activate(i){
    if(done[i]) return;
    done[i]=true; claimed[i]=true;
    document.getElementById('vl'+i).classList.add('on');
    lineBtns[i].classList.add('done');
    colorStage(i+1);
    if(done.every(Boolean)) timers.push(setTimeout(finish,1600));
  }
  function finish(){
    if(finished) return;
    finished=true; listening=false;
    stopRec();
    setHint(SUMMARY); setUI('again');
  }
  function stopRec(){
    if(rec){ var r=rec; rec=null; r.onend=null; r.onerror=null; r.onresult=null; try{ r.abort(); }catch(e){} }
  }
  function reset(){
    timers.forEach(clearTimeout); timers=[];
    stopRec(); listening=false; fatal=false; finished=false;
    claimed=LINES.map(function(){return false;}); done=LINES.map(function(){return false;});
    art.setAttribute('class','art');
    var els=art.querySelectorAll('[data-stage]');
    for(var i=0;i<els.length;i++){ els[i].style.removeProperty('fill'); els[i].style.removeProperty('stroke'); }
    for(var k=0;k<LINES.length;k++){ document.getElementById('vl'+k).classList.remove('on'); lineBtns[k].classList.remove('done'); }
    setHint(''); setUI('idle');
  }

  // 听到的文字（可能有多个候选）→ 哪些句子读对了
  function feed(cands){
    var hits={};
    for(var c=0;c<cands.length;c++){
      var H=norm(cands[c]); if(!H.length) continue;
      for(var i=0;i<TARGETS.length;i++){
        if(!claimed[i] && !hits[i] && score(H,TARGETS[i])>=need(TARGETS[i].length)) hits[i]=true;
      }
    }
    var idx=Object.keys(hits).map(Number).sort(function(a,b){return a-b;});
    idx.forEach(function(i,k){
      claimed[i]=true;
      if(k===0) activate(i); else timers.push(setTimeout(function(){ done[i]=false; activate(i); },k*900));
    });
  }
  window.heardText=function(t){ feed([t]); };

  function fatalError(msg){
    fatal=true; listening=false; stopRec();
    setHint(msg); setUI('idle');
  }
  function startListening(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ setHint('这个浏览器听不见，可以直接点诗句。'); return; }
    setHint(''); fatal=false; finished=false;
    var r=new SR();
    r.lang='zh-CN'; r.continuous=true; r.interimResults=true; r.maxAlternatives=3;
    r.onresult=function(e){
      var cands=[];
      for(var i=e.resultIndex;i<e.results.length;i++){
        var res=e.results[i];
        for(var j=0;j<res.length;j++) cands.push(res[j].transcript);
      }
      feed(cands);
    };
    r.onerror=function(e){
      var err=e&&e.error;
      if(err==='no-speech'||err==='aborted') return;
      if(err==='not-allowed'||err==='service-not-allowed') fatalError('要允许麦克风哦，也可以直接点诗句。');
      else if(err==='audio-capture') fatalError('找不到麦克风，可以直接点诗句。');
      else if(err==='network') fatalError('没有联网，可以直接点诗句。');
      else fatalError('没听清，可以直接点诗句。');
    };
    r.onend=function(){
      if(rec===r && listening && !fatal && !finished){
        setTimeout(function(){ if(rec===r && listening && !fatal && !finished){ try{ r.start(); }catch(err){} } },250);
      }
    };
    rec=r; listening=true; setUI('listening');
    try{ r.start(); }catch(err){ fatalError('没听清，可以直接点诗句。'); }
  }

  mic.addEventListener('click',function(){
    if(finished || mic.classList.contains('again')){ reset(); return; }
    if(listening){ return; }
    startListening();
  });
  lineBtns.forEach(function(b,i){ b.addEventListener('click',function(){ claimed[i]=true; activate(i); }); });

  reset();
})();
</script></body></html>
